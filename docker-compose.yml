# Dev DB — align DB_* in .env with this service.
# Fresh setup: npm run db:setup  (or db:up → db:sync-dev → seed-intent-utterances)
# Optional: set DB_NAME_TEST=uddoktahut_test in .env so tests use a separate database.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: uddoktahut-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uddoktahut
    ports:
      - "5432:5432"
    volumes:
      - uddoktahut_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uddoktahut"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  uddoktahut_pgdata:
