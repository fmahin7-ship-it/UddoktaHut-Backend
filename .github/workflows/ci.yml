name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uddoktahut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uddoktahut_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-min-32-chars-long
      JWT_REFRESH_TOKEN: ci-test-refresh-secret-min-32
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: uddoktahut_test
      DB_NAME_TEST: uddoktahut_test
      USE_TEST_DB: "true"
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_PRICE_PRO: price_ci_pro
      STRIPE_WEBHOOK_SECRET: whsec_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate + seed test DB
        run: npm run db:prepare-test

      - name: Test
        run: npm test


      - name: Build
        run: npm run build
